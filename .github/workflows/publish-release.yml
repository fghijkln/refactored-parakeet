# Manual publish: put the APKs from an earlier green-enough parakeet run on a prerelease,
# with notes from tooling/release-notes/v<version>.md. Used to ship before a slow job finishes.
name: publish-release

on:
  workflow_dispatch:
    inputs:
      version: { description: "version, e.g. 0.2.2", required: true }
      run_id: { description: "parakeet run whose apk-zh / apk-en artifacts to publish", required: true }
      sha: { description: "commit the release tag points at", required: true }

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish v${{ inputs.version }} (prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          V: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
        run: |
          ls -l dist
          sha256sum dist/parakeet-v$V-*-arm64-v8a.apk
          gh release delete "v$V" -R "$REPO" --cleanup-tag -y 2>/dev/null || true
          gh release create "v$V" -R "$REPO" --prerelease --target "$SHA" \
            --title "Parakeet v$V" --notes-file "tooling/release-notes/v$V.md" \
            "dist/parakeet-v$V-zh-arm64-v8a.apk" "dist/parakeet-v$V-en-arm64-v8a.apk"
