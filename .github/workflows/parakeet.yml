# Parakeet 0.2 (customized dsh-Go): runtime for both ABIs and both languages, Linux host
# smoke, Flutter analyze/test, Gradle unit tests, release APKs (zh + en, arm64 + x86_64),
# APK checks, x86_64 emulator smoke, and the v$APP_VERSION prerelease from a green main.
name: parakeet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parakeet-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.2.3
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai
  # Official upstreams on GitHub runners (the repo's defaults are China mirrors).
  NODE_MIRROR: https://nodejs.org/dist
  NPM_REGISTRY: https://registry.npmjs.org
  DSH_MAVEN_MIRRORS: 0
  PUB_HOSTED_URL: https://pub.dev
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

jobs:
  runtime:
    name: Runtime ${{ matrix.abi }} (zh + en)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-cache-${{ matrix.abi }}-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**', 'runtime/host/fetch_termux.py') }}
          restore-keys: runtime-cache-${{ matrix.abi }}-
      - name: Build the host runtime (no PRoot, no Ubuntu)
        run: bash runtime/build-runtime.sh "${{ matrix.abi }}"
      - name: Runtime sizes
        run: |
          for lang in zh en; do
            ls -la "runtime/out-$lang/${{ matrix.abi }}/assets/runtime" "runtime/out-$lang/${{ matrix.abi }}/jniLibs/${{ matrix.abi }}"
          done
      - name: Root-shell plugin unit tests
        # Inside the built DSH tree, where its imports (@deepseek-ai/schemastery, dsh-tools) resolve.
        run: |
          p="runtime/.work/${{ matrix.abi }}/dsh-prefix/node_modules/@parakeet/dsh-plugin-root-shell"
          mkdir -p "$p" && cp -r runtime/plugins/parakeet-root-shell/. "$p/"
          node --test "$p"/test/*.test.mjs
      - name: Root execution mode (planner unit tests + agent turns through a sudo-backed su)
        if: matrix.abi == 'x86_64'
        run: |
          node --test runtime/tests/direct/root-exec.test.mjs
          DSH_PREFIX="runtime/.work/${{ matrix.abi }}/dsh-prefix" node runtime/tests/root-exec-live.mjs
      - name: Phone MCP under the host engine (guest-path mapper unit tests + agent turns through the relay and a fake bridge)
        if: matrix.abi == 'x86_64'
        run: |
          node --test runtime/tests/direct/host-args.test.mjs
          DSH_PREFIX="runtime/.work/${{ matrix.abi }}/dsh-prefix" node runtime/tests/phone-mcp-host-live.mjs
      - name: Host smoke on Linux (en)
        if: matrix.abi == 'x86_64'
        run: bash runtime/tests/host-smoke.sh runtime/out-en 38123
      - name: Host smoke on Linux (zh)
        if: matrix.abi == 'x86_64'
        run: bash runtime/tests/host-smoke.sh runtime/out-zh 38124
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.abi }}
          path: |
            runtime/out-zh/${{ matrix.abi }}
            runtime/out-en/${{ matrix.abi }}
          retention-days: 7
          compression-level: 0

  flutter:
    name: Flutter ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
      NOTO_CJK_VERSION: 1:20230817+repack1-3
      NOTO_EMOJI_VERSION: v2.051
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore the fonts the goldens were drawn with
        id: fonts
        uses: actions/cache/restore@v4
        with:
          path: ~/test-fonts
          key: test-fonts-${{ env.NOTO_CJK_VERSION }}-${{ env.NOTO_EMOJI_VERSION }}
      - name: Download the fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          apt-get download fonts-noto-cjk="$NOTO_CJK_VERSION" fonts-noto-cjk-extra="$NOTO_CJK_VERSION"
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
          mkdir -p ~/test-fonts
          cp unpacked/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc ~/test-fonts/
          curl -fsSL --retry 3 -o ~/test-fonts/NotoColorEmoji.ttf "https://raw.githubusercontent.com/googlefonts/noto-emoji/$NOTO_EMOJI_VERSION/fonts/NotoColorEmoji.ttf"
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $HOME/test-fonts/NotoColorEmoji.ttf" | sha256sum -c -
      - name: Save the fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/test-fonts
          key: ${{ steps.fonts.outputs.cache-primary-key }}
      - name: Install the fonts
        run: |
          sudo install -Dm644 -t "$DSH_TEST_FONT_DIR" ~/test-fonts/NotoSansCJK-*.ttc
          sudo install -Dm644 ~/test-fonts/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
      - name: Restore upstream golden images
        uses: actions/cache@v4
        with:
          path: ~/.cache/parakeet-upstream-goldens
          key: upstream-goldens-cf2f7c86
      - name: Upstream golden images (dsh-Go@cf2f7c8; not stored in this repo)
        run: bash ../tooling/fetch-upstream-goldens.sh
      - run: flutter pub get --enforce-lockfile
      - name: Analyze, and generated localization matches its source
        if: matrix.shard == 0
        run: |
          flutter analyze --no-pub
          python3 tool/l10n_merge.py
          git diff --exit-code -- lib/l10n
      - name: Test every third file (less the removed features' tests, tooling/parakeet-test-skips.txt)
        run: |
          python3 ../tooling/parakeet_test_filter.py report
          mapfile -t files < <(python3 ../tooling/parakeet_test_filter.py files ${{ matrix.shard }})
          echo "${#files[@]} test files in shard ${{ matrix.shard }}"
          name="$(python3 ../tooling/parakeet_test_filter.py name)"
          if flutter test --no-pub --concurrency=4 --reporter github --name "$name" "${files[@]}" 2>&1 | tee "$RUNNER_TEMP/test.log"; then exit 0; fi
          # One retry for the files that failed (a few upstream tests are timing-sensitive
          # under --concurrency=4); a test that fails twice fails the job.
          mapfile -t again < <(grep -oE '❌ (loading )?/[^:]+_test\.dart' "$RUNNER_TEMP/test.log" | sed -E 's#^❌ (loading )?##; s#^.*/app/##' | sort -u)
          echo "::warning::retrying ${#again[@]} file(s) once: ${again[*]}"
          [ "${#again[@]}" -gt 0 ] && [ "${#again[@]}" -le 10 ] || exit 1
          flutter test --no-pub --concurrency=1 --reporter github --name "$name" "${again[@]}"
      - name: Keep golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.shard }}
          path: app/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 7

  android-jvm:
    name: Gradle unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - working-directory: app/android
        run: gradle --stacktrace :app:testArm64DebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-test-reports
          path: app/build/app/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  apk:
    name: APK ${{ matrix.lang }}
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lang: [zh, en]
    env:
      ORG_GRADLE_PROJECT_parakeetLocale: ${{ matrix.lang }}
    steps:
      - name: Free disk space (two release ABIs + NDK outgrow the runner's free space)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /usr/local/julia* /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            "$AGENT_TOOLSDIRECTORY/CodeQL" "$AGENT_TOOLSDIRECTORY/PyPy" "$AGENT_TOOLSDIRECTORY/go" || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-x86_64
          path: runtime
      - uses: actions/download-artifact@v4
        with:
          name: runtime-arm64-v8a
          path: runtime
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Keep the original ARB files for the checks
        run: mkdir -p "$RUNNER_TEMP/arb" && cp app/lib/l10n/app_zh.arb app/lib/l10n/app_en.arb "$RUNNER_TEMP/arb/"
      - name: Flutter plugins, local.properties, official Gradle distribution
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Prepare the ${{ matrix.lang }}-only tree
        run: bash tooling/parakeet-locale.sh "${{ matrix.lang }}"
      - name: Build release APKs (arm64 + x86_64)
        run: |
          code=$(python3 tooling/build_number.py)
          bash tooling/build-apk.sh -f all -n "$code" --build-name "$APP_VERSION" -- "--dart-define=PARAKEET_LOCALE=${{ matrix.lang }}"
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-arm64-release.apk "dist/parakeet-v$APP_VERSION-${{ matrix.lang }}-arm64-v8a.apk"
          cp app/build/app/outputs/flutter-apk/app-x64-release.apk "dist/parakeet-v$APP_VERSION-${{ matrix.lang }}-x86_64.apk"
          ls -l dist
      - name: APK checks (debuggable, hosts, removed features, locale purity)
        run: |
          AAPT2=$(ls -1d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          mkdir -p dist-report
          rc=0
          for apk in dist/*.apk; do
            python3 tooling/parakeet_apk_check.py "$apk" "${{ matrix.lang }}" --arb-dir "$RUNNER_TEMP/arb" --aapt2 "$AAPT2" --version "$APP_VERSION" --report "dist-report/$(basename "$apk" .apk).json" || rc=1
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: check-report-${{ matrix.lang }}
          path: dist-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        # also when the checks fail, so a failing APK can be inspected
        if: success() || failure()
        with:
          name: apk-${{ matrix.lang }}
          path: dist/*.apk
          retention-days: 30
          compression-level: 0

  emulator:
    name: Emulator smoke (x86_64, API 30)
    needs: [runtime, apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-en
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: runtime-x86_64
          path: runtime
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, host engine, root probe, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: bash runtime/tests/emulator-host-smoke.sh dist/parakeet-v${{ env.APP_VERSION }}-en-x86_64.apk runtime/out-en emulator-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs
          path: emulator-logs/
          retention-days: 14

  release:
    # Job names cannot read env: the tag and title come from APP_VERSION.
    name: Prerelease (APP_VERSION)
    needs: [runtime, flutter, android-jvm, apk, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true
      - name: Publish v${{ env.APP_VERSION }} (prerelease) at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          cat > notes.md <<EOF
          Parakeet v$APP_VERSION — deep customization of [dsh-Go](https://github.com/ccch1mneyyy/dsh-go) by [ccch1mneyyy](https://github.com/ccch1mneyyy) (AGPL-3.0, upstream ccch1mneyyy/dsh-Go@cf2f7c8; changes listed in PARAKEET_NOTICE.md). Not an official DSH Go build.

          Changes in 0.2.3: **Phone control works on the host engine.** In 0.2.2 the agent's phone tools (\`mcp__phone__*\`) never connected on a real phone: the engine runs on Android's own \`/\`, and the phone MCP server was handed the in-runtime path \`/var/lib/dsh-app/phone/bridge.json\`, which does not exist there, so its relay exited with ENOENT while Settings showed everything green. Now the app writes host paths into the phone (and message-search) overlay under the host engine, the runtime maps runtime-tree guest paths in every child's arguments and environment (never Android's own /system, /data, /sdcard, /storage, /proc), and the relay falls back to its own tree. Phone control's status line and the diagnostics now report whether the MCP server really connected (or why not) instead of only the switch, accessibility and bridge. Root mode (0.2.2) is unchanged.

          * \`parakeet-v$APP_VERSION-zh-arm64-v8a.apk\` — 纯中文版 (arm64 phones)
          * \`parakeet-v$APP_VERSION-en-arm64-v8a.apk\` — English-only build (arm64 phones)

          - Host runtime: DeepSeek Harness on Termux's Bionic node + bash, shipped unmodified as native libs; no Ubuntu, no PRoot.
          - Root permission (Settings › System permissions › Root): the agent's commands run as uid 0; brick-risk commands are always confirmed once. root_shell / root_status stay available.
          - Removed: feedback, DeepSeek account sign-in, telemetry/usage statistics, update checks, star prompt, forum/community, share links.
          - Separate pure-Chinese and pure-English APKs; /sdcard can be chosen as a workspace.
          - Known gap: in the English APK, agent-facing text that upstream writes in Chinese only (the bundled dsh-go-ui / dsh-go-plugin / dsh-go-support skills, the phone-control tool descriptions and results, the AGENTS.md section and safe-mode report) is still Chinese; the app UI and the user guide skill are English.
          - applicationId dev.parakeet.dshgo (installs beside dsh-Go and Parakeet 0.1.x), release build, not debuggable, self-signed with the repo's Parakeet key.

          Built from ${{ github.sha }}. Verified in CI: runtime build for arm64-v8a/x86_64 in both languages, Linux host smoke, Flutter analyze + tests, Gradle unit tests, APK checks (not debuggable, no upstream hosts, no removed-feature strings, one UI language per APK; the documented exceptions are in tooling/parakeet_apk_check.py ALLOW), x86_64 emulator smoke (API 30, with an unreadable fake Termux tree at /data/data/com.termux: host engine boots and serves, root plugin registered, fake-su root probe, APK installs and launches, the app's own engine unpacks, starts and answers HTTP, a real agent turn with Root granted runs \`id -u\` as 0 through su, a brick-risk command is stopped at the confirmation and does not run, the phone MCP server connects under the host engine with guest-path and host-path rows (tools listed and called through the relay to a fake bridge), and the app's own engine with phone control on reports the MCP server connected). Not verified on a real arm64 phone or with a real KernelSU grant prompt.
          EOF
          sed -i 's/^          //' notes.md
          gh release delete "v$APP_VERSION" -R "$REPO" --cleanup-tag -y 2>/dev/null || true
          gh release create "v$APP_VERSION" -R "$REPO" --prerelease --target "${{ github.sha }}" \
            --title "Parakeet v$APP_VERSION" --notes-file notes.md \
            "dist/parakeet-v$APP_VERSION-zh-arm64-v8a.apk" "dist/parakeet-v$APP_VERSION-en-arm64-v8a.apk"
